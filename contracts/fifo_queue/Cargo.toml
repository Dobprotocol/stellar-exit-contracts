[package]
name = "fifo-queue"
version = "0.1.0"
edition = "2021"
description = "Public, unjumpable waiting line for exits with no acceptable bid"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
