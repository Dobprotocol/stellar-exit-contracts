[package]
name = "lp-vault"
version = "0.1.0"
edition = "2021"
description = "Liquidity Node capital vault for the DobDex exit layer"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
